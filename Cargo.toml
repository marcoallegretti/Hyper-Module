[workspace]
members = [
    "crates/audio-engine",
    "crates/audio-source",
    "crates/arrangement-renderer",
    "crates/clip-engine",
    "crates/media-cache",
    "crates/mixer-runtime",
    "crates/offline-renderer",
    "crates/playback-compiler",
    "crates/playback-json",
    "crates/playback-session",
    "crates/recording-journal",
    "crates/recording-transport",
    "software/IDE/audio-backend",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
