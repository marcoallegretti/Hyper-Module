[workspace]
members = [
    "crates/audio-engine",
    "crates/audio-source",
    "crates/arrangement-renderer",
    "crates/clip-engine",
    "crates/control-mappings",
    "crates/media-cache",
    "crates/mapping-compiler",
    "crates/mixer-runtime",
    "crates/offline-renderer",
    "crates/panel-protocol",
    "crates/playback-compiler",
    "crates/playback-json",
    "crates/playback-session",
    "crates/project-loader",
    "crates/project-model",
    "crates/recording-journal",
    "crates/recording-metadata",
    "crates/recording-transport",
    "crates/recording-worker",
    "crates/storage-engine",
    "crates/strict-json",
    "crates/thread-supervisor",
    "software/IDE/audio-backend",
    "software/IDE/application",
    "software/IDE/desktop-ui",
    "software/IDE/fs-authority",
    "software/IDE/mapping-editor",
    "software/IDE/panel-simulator",
    "software/RUNTIME/control-runtime",
    "software/RUNTIME/panel-session",
]
exclude = ["third_party/pipewire"]
resolver = "3"

[patch.crates-io]
pipewire = { path = "third_party/pipewire" }

[workspace.package]
edition = "2024"
rust-version = "1.93"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
