[package]
name = "hyper-playback-session"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
hyper-audio-source = { path = "../audio-source" }
hyper-clip-engine = { path = "../clip-engine" }
hyper-media-cache = { path = "../media-cache" }
hyper-playback-compiler = { path = "../playback-compiler" }
hyper-playback-json = { path = "../playback-json" }

[features]
# Exposes constructors for immutable playback automation views to consumer
# tests. Off by default, so production builds receive only runtime-owned
# observations.
test-support = []

[lints]
workspace = true
