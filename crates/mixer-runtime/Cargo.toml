[package]
name = "hyper-mixer-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
hyper-arrangement-renderer = { path = "../arrangement-renderer" }
hyper-audio-engine = { path = "../audio-engine" }
hyper-media-cache = { path = "../media-cache" }
hyper-native-device = { path = "../native-device" }
hyper-playback-compiler = { path = "../playback-compiler" }
hyper-playback-json = { path = "../playback-json" }
rtrb = "=0.3.4"
sha2 = "=0.10.9"

[features]
# Exposes constructors for mixer state that only a running mixer can otherwise
# produce, so crates that read that state can be tested without one. Off by
# default, so a production build still cannot forge restorable state.
test-support = []

[dev-dependencies]
hyper-audio-source = { path = "../audio-source" }

[lints]
workspace = true
