[package]
name = "hyper-storage-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cap-std = "=4.0.2"
cap-fs-ext = "=4.0.2"
hyper-control-mappings = { path = "../control-mappings" }
hyper-project-model = { path = "../project-model" }
hyper-recording-metadata = { path = "../recording-metadata" }
hyper-strict-json = { path = "../strict-json" }
hound = "=3.5.1"
same-file = "=1.0.6"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_json_canonicalizer = "=0.3.2"
sha2 = "=0.10.9"
uuid = { version = "=1.24.0", features = ["v4"] }

[target.'cfg(windows)'.dev-dependencies]
junction = { version = "=2.0.0", default-features = false }

[lints]
workspace = true
