[package]
name = "hyper-recording-journal"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cap-std = "=4.0.2"
cap-fs-ext = "=4.0.2"
crc32fast = "=1.5.0"
hound = "=3.5.1"
same-file = "=1.0.6"
sha2 = "=0.10.9"
uuid = { version = "=1.24.0", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_IO",
] }

[dev-dependencies]
hyper-recording-transport = { path = "../recording-transport" }

[target.'cfg(windows)'.dev-dependencies]
junction = { version = "=2.0.0", default-features = false }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "deny"
pedantic = "deny"
