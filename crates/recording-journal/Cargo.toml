[package]
name = "hyper-recording-journal"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
crc32fast = "=1.5.0"
hound = "=3.5.1"
same-file = "=1.0.6"
sha2 = "=0.10.9"
uuid = { version = "=1.24.0", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

[dev-dependencies]
hyper-recording-transport = { path = "../recording-transport" }

[target.'cfg(windows)'.dev-dependencies]
junction = { version = "=2.0.0", default-features = false }

[lints]
workspace = true
