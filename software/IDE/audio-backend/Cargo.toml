[package]
name = "hyper-desktop-audio"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
hyper-arrangement-renderer = { path = "../../../crates/arrangement-renderer" }
hyper-audio-source = { path = "../../../crates/audio-source" }
hyper-audio-engine = { path = "../../../crates/audio-engine" }
hyper-control-runtime = { path = "../../RUNTIME/control-runtime" }
hyper-panel-protocol = { path = "../../../crates/panel-protocol" }
hyper-control-mappings = { path = "../../../crates/control-mappings" }
hyper-media-cache = { path = "../../../crates/media-cache" }
hyper-mixer-runtime = { path = "../../../crates/mixer-runtime" }
hyper-native-device = { path = "../../../crates/native-device" }
hyper-mapping-compiler = { path = "../../../crates/mapping-compiler" }
hyper-playback-compiler = { path = "../../../crates/playback-compiler" }
hyper-playback-json = { path = "../../../crates/playback-json" }
hyper-playback-session = { path = "../../../crates/playback-session" }
hyper-project-loader = { path = "../../../crates/project-loader" }
hyper-recording-journal = { path = "../../../crates/recording-journal" }
hyper-recording-metadata = { path = "../../../crates/recording-metadata" }
hyper-recording-transport = { path = "../../../crates/recording-transport" }
hyper-recording-worker = { path = "../../../crates/recording-worker" }
hyper-storage-engine = { path = "../../../crates/storage-engine" }
hyper-thread-supervisor = { path = "../../../crates/thread-supervisor" }
ringbuf = "=0.5.1"
rubato = { version = "=4.0.0", default-features = false }

[target.'cfg(all(target_os = "linux", target_endian = "little"))'.dependencies]
bytemuck = "=1.24.0"
pipewire = "=0.10.0"
spa-sys = { package = "libspa-sys", version = "=0.10.0" }

[target.'cfg(target_os = "windows")'.dependencies]
bytemuck = "=1.24.0"
wasapi = "=0.22.0"

[dev-dependencies]
hyper-mixer-runtime = { path = "../../../crates/mixer-runtime", features = ["test-support"] }
