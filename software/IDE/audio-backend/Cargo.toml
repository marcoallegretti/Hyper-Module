[package]
name = "hyper-desktop-audio"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[target.'cfg(all(target_os = "linux", target_endian = "little"))'.dependencies]
bytemuck = "=1.24.0"
hyper-arrangement-renderer = { path = "../../../crates/arrangement-renderer" }
hyper-media-cache = { path = "../../../crates/media-cache" }
hyper-mixer-runtime = { path = "../../../crates/mixer-runtime" }
hyper-playback-compiler = { path = "../../../crates/playback-compiler" }
hyper-playback-json = { path = "../../../crates/playback-json" }
hyper-playback-session = { path = "../../../crates/playback-session" }
pipewire = "=0.10.0"
spa-sys = { package = "libspa-sys", version = "=0.10.0" }

[target.'cfg(target_os = "windows")'.dependencies]
bytemuck = "=1.24.0"
wasapi = "=0.22.0"
