[package]
name = "hyper-project-history"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cap-fs-ext = "=4.0.2"
cap-std = "=4.0.2"
directories = "=6.0.0"
hyper-fs-authority = { path = "../../../crates/fs-authority" }
hyper-project-model = { path = "../../../crates/project-model" }
hyper-strict-json = { path = "../../../crates/strict-json" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_json_canonicalizer = "=0.3.2"
uuid = { version = "=1.24.0", features = ["v4"] }

[lints]
workspace = true

[target.'cfg(windows)'.dev-dependencies]
junction = { version = "=2.0.0", default-features = false }
