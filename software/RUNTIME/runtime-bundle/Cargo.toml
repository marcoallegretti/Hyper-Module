[package]
name = "hyper-runtime-bundle"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cap-fs-ext = "=4.0.2"
cap-std = "=4.0.2"
hyper-project-loader = { path = "../../../crates/project-loader" }
hyper-project-model = { path = "../../../crates/project-model" }
hyper-storage-engine = { path = "../../../crates/storage-engine" }
hyper-strict-json = { path = "../../../crates/strict-json" }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
