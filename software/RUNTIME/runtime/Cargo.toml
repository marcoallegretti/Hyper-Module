[package]
name = "hyper-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "hyper-runtime"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
hyper-audio-engine = { path = "../../../crates/audio-engine" }
hyper-audio-source = { path = "../../../crates/audio-source" }
hyper-control-runtime = { path = "../control-runtime" }
hyper-desktop-audio = { path = "../../IDE/audio-backend" }
hyper-media-cache = { path = "../../../crates/media-cache" }
hyper-panel-protocol = { path = "../../../crates/panel-protocol" }
hyper-playback-compiler = { path = "../../../crates/playback-compiler" }
hyper-playback-json = { path = "../../../crates/playback-json" }
hyper-playback-session = { path = "../../../crates/playback-session" }
hyper-project-loader = { path = "../../../crates/project-loader" }
hyper-project-model = { path = "../../../crates/project-model" }
hyper-recording-journal = { path = "../../../crates/recording-journal" }
hyper-recording-metadata = { path = "../../../crates/recording-metadata" }
hyper-recording-worker = { path = "../../../crates/recording-worker" }
hyper-runtime-deployment = { path = "../deployment" }
hyper-runtime-host = { path = "../runtime-host" }
hyper-mixer-runtime = { path = "../../../crates/mixer-runtime" }
hyper-native-device = { path = "../../../crates/native-device" }
hyper-runtime-mixer-update = { path = "../../../crates/runtime-mixer-update" }
hyper-runtime-automation-update = { path = "../../../crates/runtime-automation-update" }
hyper-runtime-loop-update = { path = "../../../crates/runtime-loop-update" }
hyper-scene-performance = { path = "../../../crates/scene-performance" }
hyper-storage-engine = { path = "../../../crates/storage-engine" }
hyper-runtime-native-device-update = { path = "../../../crates/runtime-native-device-update" }
hyper-runtime-recording-update = { path = "../../../crates/runtime-recording-update" }
chrono = "=0.4.45"
slint = { version = "=1.17.1", default-features = false, features = [
    "accessibility",
    "backend-winit",
    "compat-1-2",
    "renderer-femtovg",
    "std",
] }
uuid = { version = "=1.24.0", features = ["v4"] }

[build-dependencies]
slint-build = "=1.17.1"

[dev-dependencies]
hyper-arrangement-renderer = { path = "../../../crates/arrangement-renderer" }
hyper-audio-engine = { path = "../../../crates/audio-engine" }
hyper-desktop-audio = { path = "../../IDE/audio-backend", features = ["test-support"] }
hyper-playback-compiler = { path = "../../../crates/playback-compiler" }
hyper-mixer-runtime = { path = "../../../crates/mixer-runtime", features = ["test-support"] }
i-slint-backend-testing = "=1.17.1"
serde_json = "=1.0.151"
serde_json_canonicalizer = "=0.3.2"
