name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-boundary:
    name: Public repository boundary
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Reject private paths
        run: node contracts/scripts/check-public-boundary.mjs

      - name: Test private-path policy
        run: node contracts/scripts/test-public-boundary.mjs

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            experimental: false
          - os: ubuntu-26.04
            experimental: true
          - os: windows-2022
            experimental: false
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component clippy,rustfmt

      - name: Install PipeWire development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libpipewire-0.3-dev pipewire pipewire-bin wireplumber

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint all targets and features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test workspace outside the bounded IDE worker harness
        run: cargo test --workspace --exclude hyper-desktop-ide --all-targets --locked

      - name: Test bounded IDE worker harness
        run: cargo test -p hyper-desktop-ide --all-targets --locked -- --test-threads=1

      - name: Lint and test vendored PipeWire bindings
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: target
        run: |
          cargo clippy --manifest-path third_party/pipewire/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path third_party/pipewire/Cargo.toml

      - name: Build optimized workspace
        run: cargo build --workspace --all-targets --locked --release

      - name: Test optimized audio paths
        run: cargo test --locked --release -p hyper-audio-engine -p hyper-mixer-runtime -p hyper-desktop-audio

      - name: Test live PipeWire output
        if: runner.os == 'Linux'
        run: bash software/IDE/audio-backend/scripts/test-pipewire-live.sh

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Package optimized Linux applications
        if: runner.os == 'Linux' && matrix.experimental == false
        run: |
          archive="$RUNNER_TEMP/hyper-module-linux-x86_64.tar.gz"
          tar --sort=name --mtime='UTC 1980-01-01' --owner=0 --group=0 --numeric-owner --format=gnu -I 'gzip -n' -cf "$archive" -C target/release hyper-desktop-ui hyper-runtime
          sha256sum "$archive" | sed "s|  $archive|  hyper-module-linux-x86_64.tar.gz|" > "$archive.sha256"

      - name: Package optimized Windows applications
        if: runner.os == 'Windows' && matrix.experimental == false
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "hyper-module-windows-x86_64"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          Copy-Item -LiteralPath "target/release/hyper-desktop-ui.exe" -Destination $output
          Copy-Item -LiteralPath "target/release/hyper-runtime.exe" -Destination $output
          $timestamp = [DateTimeOffset]::Parse("1980-01-01T00:00:00Z").UtcDateTime
          Get-ChildItem -LiteralPath $output | ForEach-Object { $_.LastWriteTimeUtc = $timestamp }
          $archive = Join-Path $env:RUNNER_TEMP "hyper-module-windows-x86_64.zip"
          $applications = @(
            (Join-Path $output "hyper-desktop-ui.exe")
            (Join-Path $output "hyper-runtime.exe")
          )
          Compress-Archive -LiteralPath $applications -DestinationPath $archive -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  hyper-module-windows-x86_64.zip" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii -NoNewline

      - name: Upload optimized Linux applications
        if: runner.os == 'Linux' && matrix.experimental == false
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hyper-module-linux-x86_64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hyper-module-linux-x86_64.tar.gz
            ${{ runner.temp }}/hyper-module-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload optimized Windows applications
        if: runner.os == 'Windows' && matrix.experimental == false
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hyper-module-windows-x86_64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hyper-module-windows-x86_64.zip
            ${{ runner.temp }}/hyper-module-windows-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  contracts:
    name: Contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: contracts/package-lock.json
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Test contracts
        run: npm test
