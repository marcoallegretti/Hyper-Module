name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-boundary:
    name: Public repository boundary
    runs-on: ubuntu-24.04
    env:
      REPORT_DIR: ci-reports
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Initialize public-boundary test report
        shell: bash
        run: |
          mkdir -p "$REPORT_DIR"
          {
            printf 'schema=hyper-ci-test-report-v1\n'
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'ref=%s\n' "$GITHUB_REF"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'workflow_commit=%s\n' "$GITHUB_WORKFLOW_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'job=%s\n' "$GITHUB_JOB"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'report.reject-private-paths.log=node contracts/scripts/check-public-boundary.mjs\n'
            printf 'report.private-path-policy.log=node contracts/scripts/test-public-boundary.mjs\n'
          } > "$REPORT_DIR/manifest.txt"

      - name: Reject private paths
        shell: bash
        run: node contracts/scripts/check-public-boundary.mjs 2>&1 | tee "$REPORT_DIR/reject-private-paths.log"

      - name: Test private-path policy
        shell: bash
        run: node contracts/scripts/test-public-boundary.mjs 2>&1 | tee "$REPORT_DIR/private-path-policy.log"

      - name: Upload public-boundary test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hyper-test-report-public-boundary-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ github.workspace }}/ci-reports
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    env:
      REPORT_DIR: ci-reports
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            experimental: false
          - os: ubuntu-26.04
            experimental: true
          - os: windows-2022
            experimental: false
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Initialize Rust test report
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          mkdir -p "$REPORT_DIR"
          {
            printf 'schema=hyper-ci-test-report-v1\n'
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'ref=%s\n' "$GITHUB_REF"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'workflow_commit=%s\n' "$GITHUB_WORKFLOW_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'job=%s\n' "$GITHUB_JOB"
            printf 'matrix_os=%s\n' "$MATRIX_OS"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'report.workspace-tests.log=cargo test --workspace --exclude hyper-desktop-ide --all-targets --locked\n'
            printf 'report.ide-tests.log=cargo test -p hyper-desktop-ide --all-targets --locked -- --test-threads=1\n'
            printf 'report.vendored-pipewire-tests.log=cargo test --manifest-path third_party/pipewire/Cargo.toml\n'
            printf 'condition.vendored-pipewire-tests.log=runner_os==Linux\n'
            printf 'report.optimized-audio-tests.log=cargo test --locked --release -p hyper-audio-engine -p hyper-mixer-runtime -p hyper-desktop-audio\n'
            printf 'report.live-pipewire-output.log=bash software/IDE/audio-backend/scripts/test-pipewire-live.sh\n'
            printf 'condition.live-pipewire-output.log=runner_os==Linux\n'
          } > "$REPORT_DIR/manifest.txt"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component clippy,rustfmt

      - name: Install PipeWire development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libpipewire-0.3-dev pipewire pipewire-bin wireplumber

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint all targets and features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test workspace outside the bounded IDE worker harness
        shell: bash
        run: cargo test --workspace --exclude hyper-desktop-ide --all-targets --locked 2>&1 | tee "$REPORT_DIR/workspace-tests.log"

      - name: Test bounded IDE worker harness
        shell: bash
        run: cargo test -p hyper-desktop-ide --all-targets --locked -- --test-threads=1 2>&1 | tee "$REPORT_DIR/ide-tests.log"

      - name: Lint and test vendored PipeWire bindings
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: target
        shell: bash
        run: |
          cargo clippy --manifest-path third_party/pipewire/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path third_party/pipewire/Cargo.toml 2>&1 | tee "$REPORT_DIR/vendored-pipewire-tests.log"

      - name: Test optimized audio paths
        shell: bash
        run: cargo test --locked --release -p hyper-audio-engine -p hyper-mixer-runtime -p hyper-desktop-audio 2>&1 | tee "$REPORT_DIR/optimized-audio-tests.log"

      - name: Test live PipeWire output
        if: runner.os == 'Linux'
        shell: bash
        run: bash software/IDE/audio-backend/scripts/test-pipewire-live.sh 2>&1 | tee "$REPORT_DIR/live-pipewire-output.log"

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Upload Rust test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hyper-test-report-rust-${{ matrix.os }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ github.workspace }}/ci-reports
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

  package:
    name: Package (${{ matrix.os }})
    needs: [public-boundary, rust, contracts]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
    env:
      REPORT_DIR: ci-reports
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Initialize package report
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          mkdir -p "$REPORT_DIR"
          {
            printf 'schema=hyper-ci-test-report-v1\n'
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'ref=%s\n' "$GITHUB_REF"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'workflow_commit=%s\n' "$GITHUB_WORKFLOW_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'job=%s\n' "$GITHUB_JOB"
            printf 'matrix_os=%s\n' "$MATRIX_OS"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'report.optimized-applications.log=cargo build --locked --release -p hyper-desktop-ui -p hyper-runtime -p hyper-fs-authority\n'
            printf 'report.application-inspection-smoke.log=optimized hyper-desktop-ui and hyper-runtime help/version commands\n'
            printf 'report.package-deployment-smoke.log=extracted kit deployment\n'
            printf 'report.native-deployment-promotion.log=native Runtime promotion of extracted kit deployment\n'
          } > "$REPORT_DIR/manifest.txt"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal

      - name: Install PipeWire development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libpipewire-0.3-dev pipewire pipewire-bin wireplumber

      - name: Build optimized applications and filesystem authority
        shell: bash
        run: cargo build --locked --release -p hyper-desktop-ui -p hyper-runtime -p hyper-fs-authority 2>&1 | tee "$REPORT_DIR/optimized-applications.log"

      - name: Smoke-test optimized application inspection commands
        shell: bash
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            suffix=".exe"
          fi
          desktop_ide="./target/release/hyper-desktop-ui${suffix}"
          runtime="./target/release/hyper-runtime${suffix}"
          {
            "$desktop_ide" --help &&
              "$desktop_ide" --version &&
              "$runtime" --help &&
              "$runtime" --version
          } 2>&1 | tee "$REPORT_DIR/application-inspection-smoke.log"

      - name: Install Node.js for local deployment kit
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: contracts/package-lock.json
          package-manager-cache: false

      - name: Install locked local deployment dependencies
        working-directory: contracts
        run: npm ci --ignore-scripts

      - name: Package optimized Linux applications
        if: runner.os == 'Linux'
        run: |
          output="$RUNNER_TEMP/hyper-module-linux-x86_64"
          kit="$output/deployment-kit"
          mkdir -p "$kit/bin"
          cp target/release/hyper-desktop-ui target/release/hyper-runtime README.md THIRD_PARTY_NOTICES.md "$output"
          cp contracts/package.json contracts/package-lock.json contracts/THIRD_PARTY_NOTICES.md "$kit"
          cp contracts/fixtures/valid/deployment-storage-policy.json "$kit/storage-policy.example.json"
          cp -R contracts/lib contracts/scripts contracts/schemas contracts/node_modules "$kit"
          cp target/release/hyper-fs-authority "$kit/bin"
          archive="$RUNNER_TEMP/hyper-module-linux-x86_64.tar.gz"
          tar --sort=name --mtime='UTC 1980-01-01' --owner=0 --group=0 --numeric-owner --format=gnu -I 'gzip -n' -cf "$archive" -C "$output" hyper-desktop-ui hyper-runtime README.md THIRD_PARTY_NOTICES.md deployment-kit
          sha256sum "$archive" | sed "s|  $archive|  hyper-module-linux-x86_64.tar.gz|" > "$archive.sha256"
          extract="$RUNNER_TEMP/hyper-module-linux-extracted"
          smoke="$RUNNER_TEMP/hyper-module-linux-deployment-smoke"
          mkdir -p "$extract" "$smoke"
          tar -xzf "$archive" -C "$extract"
          runtime_version=$("$extract/hyper-runtime" --version | awk '{print $2}')
          node "$extract/deployment-kit/scripts/smoke-packaged-deployment.mjs" "$smoke" "$runtime_version" 2>&1 | tee "$REPORT_DIR/package-deployment-smoke.log"
          HYPER_CONTRACT_DEPLOYMENT_TARGET="$smoke/target" HYPER_CONTRACT_DEPLOYMENT_MODE=promote HYPER_CONTRACT_RUNTIME_VERSION="$runtime_version" \
            cargo test --locked -p hyper-runtime-deployment --test contract \
              resolves_a_javascript_managed_deployment_target -- --ignored --exact 2>&1 | tee "$REPORT_DIR/native-deployment-promotion.log"
          grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured;' "$REPORT_DIR/native-deployment-promotion.log"

      - name: Package optimized Windows applications
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "hyper-module-windows-x86_64"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          Copy-Item -LiteralPath "target/release/hyper-desktop-ui.exe" -Destination $output
          Copy-Item -LiteralPath "target/release/hyper-runtime.exe" -Destination $output
          Copy-Item -LiteralPath "README.md" -Destination $output
          Copy-Item -LiteralPath "THIRD_PARTY_NOTICES.md" -Destination $output
          $kit = Join-Path $output "deployment-kit"
          New-Item -ItemType Directory -Path (Join-Path $kit "bin") -Force | Out-Null
          Copy-Item -LiteralPath "contracts/package.json", "contracts/package-lock.json", "contracts/THIRD_PARTY_NOTICES.md" -Destination $kit
          Copy-Item -LiteralPath "contracts/fixtures/valid/deployment-storage-policy.json" -Destination (Join-Path $kit "storage-policy.example.json")
          Copy-Item -LiteralPath "contracts/lib", "contracts/scripts", "contracts/schemas", "contracts/node_modules" -Destination $kit -Recurse
          Copy-Item -LiteralPath "target/release/hyper-fs-authority.exe" -Destination (Join-Path $kit "bin")
          $timestamp = [DateTimeOffset]::Parse("1980-01-01T00:00:00Z")
          $archive = Join-Path $env:RUNNER_TEMP "hyper-module-windows-x86_64.zip"
          $zip = [System.IO.Compression.ZipFile]::Open($archive, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            foreach ($file in @(Get-ChildItem -LiteralPath $output -File -Recurse -Force | Sort-Object FullName)) {
              $entryName = [System.IO.Path]::GetRelativePath($output, $file.FullName).Replace('\', '/')
              $entry = $zip.CreateEntry($entryName, [System.IO.Compression.CompressionLevel]::Optimal)
              $entry.LastWriteTime = $timestamp
              $entry.ExternalAttributes = 0
              $source = [System.IO.File]::OpenRead($file.FullName)
              $destination = $entry.Open()
              try {
                $source.CopyTo($destination)
              } finally {
                $destination.Dispose()
                $source.Dispose()
              }
            }
          } finally {
            $zip.Dispose()
          }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  hyper-module-windows-x86_64.zip" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii -NoNewline
          $extract = Join-Path $env:RUNNER_TEMP "hyper-module-windows-extracted"
          $smoke = Join-Path $env:RUNNER_TEMP "hyper-module-windows-deployment-smoke"
          New-Item -ItemType Directory -Path $smoke -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $runtimeVersion = (& (Join-Path $extract "hyper-runtime.exe") --version).Split(' ')[-1]
          $smokeScript = Join-Path $extract "deployment-kit/scripts/smoke-packaged-deployment.mjs"
          $smokeLog = Join-Path $env:REPORT_DIR "package-deployment-smoke.log"
          node $smokeScript $smoke $runtimeVersion 2>&1 | Tee-Object -FilePath $smokeLog
          if ($LASTEXITCODE -ne 0) { throw "extracted deployment kit smoke failed" }
          $env:HYPER_CONTRACT_DEPLOYMENT_TARGET = Join-Path $smoke "target"
          $env:HYPER_CONTRACT_DEPLOYMENT_MODE = "promote"
          $env:HYPER_CONTRACT_RUNTIME_VERSION = $runtimeVersion
          $promotionLog = Join-Path $env:REPORT_DIR "native-deployment-promotion.log"
          cargo test --locked -p hyper-runtime-deployment --test contract resolves_a_javascript_managed_deployment_target -- --ignored --exact 2>&1 | Tee-Object -FilePath $promotionLog
          if ($LASTEXITCODE -ne 0) { throw "native Runtime rejected the packaged deployment" }
          if (-not (Select-String -LiteralPath $promotionLog -Pattern '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured;' -Quiet)) {
            throw "native Runtime promotion test did not run exactly once"
          }

      - name: Upload optimized Linux applications
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hyper-module-linux-x86_64-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hyper-module-linux-x86_64.tar.gz
            ${{ runner.temp }}/hyper-module-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload optimized Windows applications
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hyper-module-windows-x86_64-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hyper-module-windows-x86_64.zip
            ${{ runner.temp }}/hyper-module-windows-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload package report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hyper-test-report-package-${{ matrix.os }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ github.workspace }}/ci-reports
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

  contracts:
    name: Contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      REPORT_DIR: ../ci-reports
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Initialize contract test report
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          mkdir -p "$REPORT_DIR"
          {
            printf 'schema=hyper-ci-test-report-v1\n'
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'ref=%s\n' "$GITHUB_REF"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'workflow_commit=%s\n' "$GITHUB_WORKFLOW_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'job=%s\n' "$GITHUB_JOB"
            printf 'matrix_os=%s\n' "$MATRIX_OS"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'report.contract-tests.log=npm test\n'
          } > "$REPORT_DIR/manifest.txt"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: contracts/package-lock.json
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Test contracts
        shell: bash
        run: npm test 2>&1 | tee "$REPORT_DIR/contract-tests.log"

      - name: Upload contract test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hyper-test-report-contracts-${{ matrix.os }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ github.workspace }}/ci-reports
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
